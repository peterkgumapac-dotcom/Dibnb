[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Bump timeout from the 10s default — Guesty's API can be slow under load.
  # 26s is the max on Netlify's paid tiers; free tier caps at 10s.
  included_files = []

# SPA fallback — but never swallow /api/* (functions handle those via their `path` config).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  framework = "vite"
  autoLaunch = false
